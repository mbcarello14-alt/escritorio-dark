# Marca-Página — configuração de produção
canal: livros
ativo: true
nome: "Marca-Página"
segredo_youtube: YT_REFRESH_LIVROS

voz:
  motor: [gemini, google, edge]   # IA: Gemini TTS (natural), reservas Google e Edge · 'gravada' = você narra
  gemini_voz: Leda
  gemini_tom: >-
    Narre em português do Brasil, com sotaque brasileiro neutro, como uma apresentadora inteligente e bem-humorada comentando um livro com uma amiga: tom de conversa, opinião firme, ironia leve e pausas para reflexão.
  gemini_tom_teste: >-
    Você é uma leitora brasileira inteligente e bem-humorada comentando um livro com uma amiga. Leia em português do Brasil, sotaque brasileiro neutro, em tom de conversa próxima, e não de locução. Varie o ritmo: mais leve e rápido nos resumos, mais lento e pensativo quando der uma opinião ou fizer uma crítica. Deixe a ironia e o sorriso aparecerem na voz nas partes engraçadas. Faça pausas curtas antes das conclusões, como quem pensa antes de falar. Evite volume e entonação constantes; soe como uma pessoa real falando, não lendo.
  google_voz: pt-BR-Chirp3-HD-Charon
  kokoro_voz: pm_santa
  edge_voz: pt-BR-AntonioNeural
  openai_voz: echo
  velocidade: 1.0

estilo:
  modo: ilustrado        # estilo Tinocando: ilustrações próprias + cortes rápidos
  fundo: "#7A1F2B"
  destaque: "#E9B44C"
  destaque2: "#F3EBDD"
  texto: "#F3EBDD"
  fonte_titulo: DMSerifDisplay-Regular.ttf
  fonte_titulo_variacao: null
  fonte_texto: Inter.ttf
  caixa_alta_titulo: false

video:
  musica_humor: calmo
  volume_musica_db: -25
  movimento_padrao: zoom_lento

imagens:
  fontes: [flux, higgsfield, wikimedia, openverse]   # flux = IA grátis no Cloudflare
  estilo_ilustracao: >-
    flat 2D editorial illustration, burgundy, mustard and cream palette, soft paper
    texture, expressive cartoon characters with simple faces, witty conceptual metaphors,
    no text, no letters, no watermark, no book covers

apresentador:            # personagem fixo na "webcam" do canto (desenhado pelo motor, grátis)
  ligado: false            # desligado a pedido do Miguel (22/10); true para voltar
  nome: "Lia"
  posicao: inferior_direita
  tamanho: 0.30
  cenario: estante
  parede: "#7A3A42"
  pele: "#E8B994"
  cabelo: "#5A2E1E"
  penteado: coque
  oculos: true
  cor_oculos: "#2B2B2B"
  roupa: "#E9B44C"
  gola: cardigan
  blusa: "#F3EBDD"

canal_youtube:           # aplicado por: python -m pipeline.branding livros
  descricao: >-
    As ideias que valem a pena de cada livro, e o que ele erra. Resumo + crítica de não
    ficção, clássicos e leituras obrigatórias de vestibular: o que o livro acerta, o que
    envelheceu e para quem ele serve. Vídeos novos toda quarta e sábado.
  palavras_chave: [resumo de livro, resenha, livros, leitura, não ficção, leituras obrigatórias, clássicos]

youtube:
  categoria_id: "27"
  idioma: pt-BR
  feito_para_criancas: false
  publicar: ["wed 19:00", "sat 11:00"]   # quarta à noite e sábado de manhã
  playlist_padrao: ""
