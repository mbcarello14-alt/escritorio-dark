# Mapeado — configuração de produção
canal: vestibular
ativo: true
nome: "Mapeado"
segredo_youtube: YT_REFRESH_VESTIBULAR

voz:
  motor: [gemini, google, edge]   # IA: Gemini TTS (natural), reservas Google e Edge · 'gravada' = você narra
  gemini_voz: Orus
  gemini_tom: >-
    Narre em português do Brasil, com sotaque brasileiro neutro, como um professor jovem, animado e muito claro explicando para vestibulandos enquanto desenha no quadro: ritmo tranquilo, ênfase nas palavras-chave, tom acolhedor.
  gemini_tom_teste: >-
    Você é um professor jovem de cursinho, brasileiro, explicando para um aluno enquanto desenha um mapa mental no quadro. Leia em português do Brasil, sotaque brasileiro neutro, com naturalidade de conversa e energia boa, sem parecer locutor. Fale claro e um pouco mais devagar nas palavras-chave e nos nomes que caem na prova, quase como quem está sublinhando. Faça pequenas pausas entre os ramos do mapa, como quem desenha. Mostre entusiasmo genuíno nas partes curiosas e um tom de cumplicidade quando der uma dica de prova. Nada de entonação cantada ou robótica; varie o ritmo como uma pessoa real.
  google_voz: pt-BR-Chirp3-HD-Kore
  kokoro_voz: pf_dora
  edge_voz: pt-BR-FranciscaNeural
  openai_voz: nova
  velocidade: 1.05

estilo:
  modo: quadro_branco    # estilo Draw My Life: tudo é "desenhado" na tela
  fundo: "#FAFAF7"
  destaque: "#F59E0B"
  destaque2: "#1E3A8A"
  texto: "#1E3A8A"
  fonte_titulo: PatrickHand.ttf
  fonte_titulo_variacao: null
  fonte_texto: PatrickHand.ttf
  escala_fonte: 1.3      # a letra de mão é menor que as outras fontes
  caixa_alta_titulo: false

video:
  musica_humor: foco
  volume_musica_db: -26
  movimento_padrao: zoom_lento

imagens:
  fontes: [flux, higgsfield, wikimedia, openverse]   # flux = IA grátis no Cloudflare
  estilo_ilustracao: >-
    simple hand-drawn black marker doodle on a plain white background, Draw My Life
    whiteboard style, thick clean outlines, minimal details, small touches of orange and
    dark blue marker, no text, no letters, no shading, no background scenery

apresentador:            # personagem fixo na "webcam" do canto (desenhado pelo motor, grátis)
  ligado: false            # desligado a pedido do Miguel (22/10); true para voltar
  nome: "Prof. Rota"
  posicao: inferior_direita
  tamanho: 0.30
  cenario: lousa
  parede: "#2F4A7A"
  pele: "#C98E64"
  cabelo: "#2A1E17"
  penteado: topete
  oculos: true
  cor_oculos: "#1E3A8A"
  roupa: "#F59E0B"
  gola: moletom

canal_youtube:           # aplicado por: python -m pipeline.branding vestibular
  descricao: >-
    O conteúdo que mais cai no ENEM e nos vestibulares, explicado em mapas mentais que se
    desenham na sua frente. Cada vídeo fecha um tema e termina com uma questão real de prova
    resolvida com o mapa. Revise em 1 minuto o que você entendeu em 10. Vídeos novos toda
    terça e quinta.
  palavras_chave: [enem, vestibular, mapa mental, resumo enem, história enem, geografia enem, revisão enem]

reels:                   # reels chamativos 3D (1 por semana, aprovados no Telegram)
  ligado: true
  publicar: ["sun 19:00"]

youtube:
  categoria_id: "27"
  idioma: pt-BR
  feito_para_criancas: false
  publicar: ["tue 17:00", "thu 17:00"]   # terça e quinta, depois da aula
  playlist_padrao: ""
