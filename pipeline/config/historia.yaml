# Ouro & Império — configuração de produção
canal: historia
ativo: true
nome: "Ouro & Império"
segredo_youtube: YT_REFRESH_HISTORIA   # nome do segredo no GitHub com o token deste canal

voz:
  motor: [gemini, google, edge]   # IA: Gemini TTS (natural), reservas Google e Edge · 'gravada' = você narra
  gemini_voz: Charon
  gemini_tom: >-
    Narre em português do Brasil, com sotaque brasileiro neutro, como um youtuber jovem e carismático explicando história e economia com bom humor: ritmo dinâmico, ironia leve nas piadas, pausas curtas antes das revelações e seriedade nos trechos tristes.
  gemini_tom_teste: >-
    Você é o narrador de um canal brasileiro de história contada pelo dinheiro. Leia em português do Brasil, sotaque brasileiro neutro, como um amigo inteligente contando uma história num bar, e não como um locutor de rádio ou de documentário. Fale com naturalidade e calor, como se estivesse improvisando. Varie o ritmo: acelere um pouco nas partes engraçadas e nas listas, desacelere e faça uma pausa curta antes de cada revelação ou número importante. Deixe a ironia aparecer na voz, com um meio sorriso nas piadas, sem exagerar. Nos trechos sobre guerra, crise ou sofrimento, baixe o tom e fale mais devagar e sério. Respire nas vírgulas, não leia tudo no mesmo volume e evite a entonação cantada de anúncio.
  google_voz: pt-BR-Chirp3-HD-Puck
  kokoro_voz: pm_alex    # vozes pt-BR do Kokoro: pm_alex, pm_santa, pf_dora
  edge_voz: pt-BR-AntonioNeural
  openai_voz: onyx
  velocidade: 1.0

estilo:
  modo: ilustrado        # estilo Tinocando: ilustrações próprias + cortes rápidos
  fundo: "#14110D"
  destaque: "#C9A24A"
  destaque2: "#9C7A2C"
  texto: "#F3EBDD"
  fonte_titulo: Cinzel.ttf
  fonte_titulo_variacao: Bold
  fonte_texto: Inter.ttf
  caixa_alta_titulo: true

video:
  musica_humor: misterio  # pasta em musica/<humor>/ (opcional)
  volume_musica_db: -24
  movimento_padrao: zoom_lento

imagens:
  fontes: [flux, higgsfield, wikimedia, openverse]   # flux = IA grátis no Cloudflare
  estilo_ilustracao: >-
    flat 2D editorial illustration, warm gold and deep black palette, textured paper grain,
    expressive cartoon characters with simple faces, humorous storytelling tone, cinematic
    composition, no text, no letters, no watermark

apresentador:            # personagem fixo na "webcam" do canto (desenhado pelo motor, grátis)
  ligado: false            # desligado a pedido do Miguel (22/10); true para voltar
  nome: "Barão Dobrão"
  posicao: inferior_direita   # inferior_direita | inferior_esquerda | superior_direita | superior_esquerda
  tamanho: 0.30               # lado da câmera em fração da altura do vídeo
  cenario: cofre              # cofre | estante | lousa
  parede: "#4A3B2A"
  pele: "#F1C9A5"
  cabelo: "#D9D4CC"
  penteado: careca_lados      # curto | topete | careca_lados | coque | longo
  bigode: true
  monoculo: true
  chapeu: cartola
  faixa_chapeu: "#C9A24A"
  roupa: "#2B2320"
  gola: terno                 # terno | moletom | cardigan
  gravata: "#8E1B1B"

youtube:
  categoria_id: "27"     # Educação
  idioma: pt-BR
  feito_para_criancas: false
  publicar: ["mon 18:00", "fri 18:00"]   # segunda e sexta (horário de Brasília)
  playlist_padrao: ""                # ID da playlist (opcional)
