# Ouro & Império — configuração de produção
canal: historia
ativo: true
nome: "Ouro & Império"
segredo_youtube: YT_REFRESH_HISTORIA   # nome do segredo no GitHub com o token deste canal

voz:
  motor: [gemini, google, edge]   # IA: Gemini TTS (natural), reservas Google e Edge · 'gravada' = você narra
  gemini_voz: Charon
  gemini_tom: >-
    Narre em português do Brasil, com sotaque brasileiro neutro, como um youtuber jovem e carismático explicando história com bom humor: ritmo dinâmico, ironia leve nas piadas, pausas curtas antes das revelações e seriedade nos trechos tristes.
  gemini_tom_teste: >-
    Você é o narrador de um canal brasileiro de história. Leia em português do Brasil, sotaque brasileiro neutro, como um amigo inteligente contando uma história num bar, e não como um locutor de rádio ou de documentário. Fale com naturalidade e calor, como se estivesse improvisando. Varie o ritmo: acelere um pouco nas partes engraçadas e nas listas, desacelere e faça uma pausa curta antes de cada revelação ou número importante. Deixe a ironia aparecer na voz, com um meio sorriso nas piadas, sem exagerar. Nos trechos sobre guerra, crise ou sofrimento, baixe o tom e fale mais devagar e sério. Respire nas vírgulas, não leia tudo no mesmo volume e evite a entonação cantada de anúncio.
  google_voz: pt-BR-Chirp3-HD-Puck
  kokoro_voz: pm_alex    # vozes pt-BR do Kokoro: pm_alex, pm_santa, pf_dora
  edge_voz: pt-BR-AntonioNeural
  openai_voz: onyx
  velocidade: 1.0

estilo:
  modo: ilustrado        # estilo Tinocando: ilustrações próprias + cortes rápidos
  fundo: "#14110D"
  destaque: "#C9A24A"
  destaque2: "#9C7A2C"
  texto: "#F3EBDD"
  fonte_titulo: Cinzel.ttf
  fonte_titulo_variacao: Bold
  fonte_texto: Inter.ttf
  caixa_alta_titulo: true
  animado: true          # cenas animadas em código (mapas, contadores, linha do tempo, títulos, partículas) — pipeline/animacao/FORMATO.md

video:
  musica_humor: misterio  # pasta em musica/<humor>/ (opcional)
  volume_musica_db: -24
  movimento_padrao: zoom_lento

imagens:
  fontes: [flux, higgsfield, wikimedia, openverse]   # flux = IA grátis no Cloudflare
  estilo_ilustracao: >-
    flat vector illustration in the style of a vintage animated history documentary: simple geometric shapes,
    no outlines, soft gradients, muted warm palette of ochre, olive green, dusty teal, cream and warm brown with
    touches of gold, simple cartoon characters with round heads and minimal friendly faces, atmospheric haze and
    soft directional light, subtle paper grain, wide cinematic composition, no text, no letters, no watermark

apresentador:            # personagem fixo na "webcam" do canto (desenhado pelo motor, grátis)
  ligado: false            # desligado a pedido do Miguel (22/10); true para voltar
  nome: "Barão Dobrão"
  posicao: inferior_direita   # inferior_direita | inferior_esquerda | superior_direita | superior_esquerda
  tamanho: 0.30               # lado da câmera em fração da altura do vídeo
  cenario: cofre              # cofre | estante | lousa
  parede: "#4A3B2A"
  pele: "#F1C9A5"
  cabelo: "#D9D4CC"
  penteado: careca_lados      # curto | topete | careca_lados | coque | longo
  bigode: true
  monoculo: true
  chapeu: cartola
  faixa_chapeu: "#C9A24A"
  roupa: "#2B2320"
  gola: terno                 # terno | moletom | cardigan
  gravata: "#8E1B1B"

reels:                   # reels chamativos 3D (3 por semana, aprovados no Telegram)
  ligado: true
  publicar: ["tue 20:00", "thu 20:00", "sun 12:00"]   # 3 reels por semana

longos:                  # vídeos longos (comando /longo ouro <tema>)
  formato: dormir
  nome_formato: "História para dormir"
  minutos: 150
  blocos: 15             # 15 blocos de ~10 min
  palavras_por_bloco: 1250
  imagens_por_bloco: 4
  publicar: ["sun 21:00"]
  automatico:            # toda semana o roteirista sugere 3 temas no Telegram; o Miguel escolhe um número
    ligado: true
    dia_sugestao: mon    # segunda de manhã, para ficar pronto até o domingo
  tom: >-
    Narre em português do Brasil, com sotaque brasileiro neutro, como um contador de histórias calmo à beira da cama:
    voz grave e baixa, ritmo lento e constante, pausas longas entre as frases, sem empolgação, sem ironia e sem
    mudanças bruscas de volume. Deve soar acolhedor e sonolento, como quem embala alguém para dormir.
  estilo_imagem: >-
    dark moody painterly illustration, candlelight and moonlight, deep shadows, muted gold and navy palette,
    soft brush texture, calm and still atmosphere, no text, no letters, no watermark

youtube:
  categoria_id: "27"     # Educação
  idioma: pt-BR
  feito_para_criancas: false
  publicar: ["mon 18:00", "fri 18:00"]   # segunda e sexta (horário de Brasília)
  playlist_padrao: ""                # ID da playlist (opcional)

# Descrição e palavras-chave do canal no YouTube (aplicar: Manutenção › branding › historia)
canal_youtube:
  descricao: |
    Ouro & Império — histórias que mudaram o mundo.

    Impérios, guerras, revoluções, personagens improváveis e mistérios do passado, contados com bom humor e muito mapa animado. Da Antiguidade aos dias de hoje, toda segunda e sexta às 18h.

    Cada vídeo é pesquisado com fontes (listadas na descrição) e checado antes de ir ao ar. As ilustrações são feitas com auxílio de IA e a narração usa voz sintética.

    Se inscreva e ative o sininho para não perder a próxima história.
  palavras_chave: [história, história geral, curiosidades históricas, impérios, idade média, antiguidade, história do brasil, história mundial, documentário animado, ouro e império]

# Thumbnail no estilo documentário (referência: canais de história animada como o Arquivo do Mundo):
# ilustração detalhada ocupando tudo + o NOME do assunto no alto, em caixa alta espaçada.
thumbnail:
  layout: topo
  fonte: Oswald-Bold.ttf
  espacamento: 0.06
  cor_texto: "#F6EEDC"
  estilo_imagem: >-
    richly detailed painterly digital illustration, cinematic wide shot, golden hour light with warm orange
    and teal sky, soft clouds, atmospheric depth, the main subject large and centered in the lower two thirds,
    calm open sky in the top third, storybook documentary poster feel, highly detailed, no text, no letters, no watermark
