# Configuração geral do escritório (vale para todos os canais)

ilustracoes:
  # Ordem de tentativa. Se todos falharem, o vídeo usa imagens livres (Wikimedia/Openverse).
  motores: [flux, higgsfield]
  max_por_video: 150
  sufixo_prompt: "Wide horizontal composition with the main subject centered, nothing important near the edges."
  flux:                         # grátis: Workers AI do seu Cloudflare, chamado pelo worker do escritório
    url: https://escritorio-dark.mbcarello14.workers.dev
    modelos: [klein, schnell]   # klein = Flux 2 Klein 4B (16:9, ~52 neurons); schnell = Flux 1 (quadrado, ~175)
    largura: 896                # 896x512 = 2 "tiles" de cobrança → ~180 imagens/dia na cota grátis
    altura: 512
    passos: 4                   # só para o schnell
    neurons_por_imagem: {klein: 55, schnell: 175}
    teto_diario_neurons: 9500   # cota grátis = 10.000/dia (vira 21h de Brasília)

higgsfield:                     # opcional e pago — só entra se houver chave e saldo
  ligado: true
  # Endpoint do modelo de imagem (confira no console.higgsfield.ai › Models › API).
  modelo: higgsfield-ai/soul/v2/standard
  # Campos extras aceitos pelo modelo (confira na página do modelo no console).
  parametros_extra:
    aspect_ratio: "16:9"
  # Controle de gasto: quando a estimativa do mês chega no teto, o motor passa a usar
  # imagens grátis (domínio público) até o mês virar.
  teto_mensal_usd: 20
  custo_estimado_por_imagem_usd: 0.03   # ajuste com o preço real que o console mostrar
  max_imagens_por_video: 120

telegram:
  # o bot só obedece a este chat (o seu). Fica no segredo TELEGRAM_CHAT_ID.
  lembrete_horas: 24   # lembra de gravar blocos pendentes depois de X horas

producao:
  inicio_rotina: "2026-10-26"   # nenhum vídeo é publicado antes deste dia
  videos_longos_por_semana: 6     # seg História · ter Mapeado · qua Livros · qui Mapeado · sex História · sáb Livros
  pauta_por_canal_por_semana:
    historia: 2
    vestibular: 2
    livros: 2
