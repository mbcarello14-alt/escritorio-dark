name: Manutenção
on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "Tarefa"
        type: choice
        options: [reparar-publicacao, testar-visual, testar-voz, branding, links-autorizacao]
      pasta:
        description: "Pasta do vídeo (reparar-publicacao) ou canais separados por espaço (branding)"
        required: false
        default: ""

permissions:
  contents: write

env:
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_HISTORIA: ${{ secrets.YT_REFRESH_HISTORIA }}
  YT_REFRESH_VESTIBULAR: ${{ secrets.YT_REFRESH_VESTIBULAR }}
  YT_REFRESH_LIVROS: ${{ secrets.YT_REFRESH_LIVROS }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  manutencao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt
      - name: Reparar registro
        if: inputs.tarefa == 'reparar-publicacao'
        run: |
          mkdir -p canais/logs
          python -m pipeline.reparar "${{ inputs.pasta }}" 2>&1 | tee canais/logs/reparar-$(date -u +%Y%m%d-%H%M%S).log
      - name: Testar ilustrações e webcam
        if: inputs.tarefa == 'testar-visual'
        run: |
          mkdir -p canais/logs
          python -m pipeline.teste_visual 2>&1 | tee canais/logs/teste-visual-$(date -u +%Y%m%d-%H%M%S).log
      - name: Mandar links para autorizar canais
        if: inputs.tarefa == 'links-autorizacao'
        run: |
          python - <<'PY'
          import hashlib, os
          from pipeline import telegram as T
          from pipeline.comum import carregar_config
          k = hashlib.sha256((os.environ["GH_PAT"] + "painel").encode()).hexdigest()[:24]
          base = "https://escritorio-dark.mbcarello14.workers.dev/oauth/inicio"
          canais = os.environ.get("CANAIS", "").split() or ["vestibular", "livros"]
          linhas = ["🔑 <b>Autorizar canais do YouTube</b>\n",
                    "Abra cada link, entre na sua conta e <b>escolha o canal certo</b> na lista. "
                    "Se aparecer \"app não verificado\": Avançado › Acessar Escritório Dark › Permitir.\n"]
          for c in canais:
              linhas.append(f'• <a href="{base}?k={k}&canal={c}">Autorizar {carregar_config(c)["nome"]}</a>')
          T.enviar("\n".join(linhas))
          PY
        env:
          CANAIS: ${{ inputs.pasta }}
      - name: Aplicar descrição e banner
        if: inputs.tarefa == 'branding'
        run: |
          mkdir -p canais/logs
          python -m pipeline.branding ${{ inputs.pasta }} 2>&1 | tee canais/logs/branding-$(date -u +%Y%m%d-%H%M%S).log
      - name: Testar narrador Gemini
        if: inputs.tarefa == 'testar-voz'
        run: |
          mkdir -p canais/logs
          python - <<'PY' 2>&1 | grep -v -i "key=" | tee canais/logs/teste-voz-$(date -u +%Y%m%d-%H%M%S).log
          import requests, os
          from pathlib import Path
          from pipeline import gemini_voz as g
          r = requests.get(f"{g.API}/models", params={"key": os.environ["GEMINI_API_KEY"], "pageSize": 200}, timeout=60)
          print("models:", r.status_code, [m["name"] for m in r.json().get("models", []) if "tts" in m["name"]] if r.ok else r.text[:300])
          print("escolhido:", g.modelo())
          for i in range(3):
              try:
                  g.sintetizar("Teste de voz número %d do Ouro e Império." % i, "Charon", g.TOM_PADRAO, Path(f"/tmp/t{i}.wav"), tentativas=1)
                  print("ok", i)
              except Exception as e:
                  print("ERRO", i, str(e)[:600])
          PY
      - name: Painel
        if: always()
        run: python -m pipeline.painel || true
      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "manutenção - ${{ inputs.tarefa }}"
