name: Rotina diária
# Todo dia: métricas do YouTube e lembretes. Às segundas: relatório da semana.
on:
  schedule:
    - cron: "0 11 * * *"   # 8h Brasília: métricas (+ relatório às segundas)
    - cron: "0 23 * * *"   # 20h Brasília: lembrete do que depende de você
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Gerar o relatório semanal agora"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_HISTORIA: ${{ secrets.YT_REFRESH_HISTORIA }}
  YT_REFRESH_VESTIBULAR: ${{ secrets.YT_REFRESH_VESTIBULAR }}
  YT_REFRESH_LIVROS: ${{ secrets.YT_REFRESH_LIVROS }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt

      - name: Lembrete da noite
        if: github.event.schedule == '0 23 * * *'
        run: python -m pipeline.bot lembrar

      - name: Métricas do YouTube
        if: github.event.schedule != '0 23 * * *'
        continue-on-error: true
        run: python -m pipeline.metricas

      - name: É dia de relatório?
        id: dia
        run: |
          r=""
          if [ "${{ inputs.relatorio }}" = "true" ]; then r=sim; fi
          if [ "$(TZ=America/Sao_Paulo date +%u)" = "1" ] && [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then r=sim; fi
          echo "relatorio=$r" >> "$GITHUB_OUTPUT"

      - name: Analista
        if: steps.dia.outputs.relatorio == 'sim'
        uses: ./.github/actions/agentes
        with:
          comando: /relatorio
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Mandar relatório
        if: steps.dia.outputs.relatorio == 'sim'
        run: python -m pipeline.bot relatorio

      - name: Painel do escritório
        if: always()
        run: python -m pipeline.painel

      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "rotina - métricas e painel"
