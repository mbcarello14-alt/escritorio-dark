name: Gestor de tráfego
# Duas vezes por dia (10h30 e 20h30 de Brasília): responde comentários, reembala vídeos fracos e avisa no Telegram.
on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trafego
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_HISTORIA: ${{ secrets.YT_REFRESH_HISTORIA }}
  YT_REFRESH_VESTIBULAR: ${{ secrets.YT_REFRESH_VESTIBULAR }}
  YT_REFRESH_LIVROS: ${{ secrets.YT_REFRESH_LIVROS }}
  GH_PAT: ${{ secrets.GH_PAT }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  trafego:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt
      - name: Coletar dados e comentários
        id: coleta
        run: python -m pipeline.trafego coletar
      - name: Gestor de tráfego (agente)
        if: steps.coleta.outputs.trabalho == 'sim'
        uses: ./.github/actions/agentes
        with:
          comando: /trafego
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Aplicar decisões
        if: steps.coleta.outputs.trabalho == 'sim'
        run: python -m pipeline.trafego aplicar
      - name: Painel
        if: always()
        run: python -m pipeline.painel || true
      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "tráfego - comentários e embalagem"
