name: Vídeos longos
# Duas rodadas por dia (6h e 16h de Brasília): escreve e checa 3 blocos do vídeo longo da vez e avança os outros
# (narração em partes, imagens, montagem) até onde as cotas grátis deixarem. A mídia fica no cache entre as rodadas.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "rodada | escrever | agendar | cancelar"
        default: rodada
      pasta:
        description: "Pasta do vídeo longo (para escrever, agendar e cancelar)"
        default: ""

permissions:
  contents: write

concurrency:
  group: longos
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_HISTORIA: ${{ secrets.YT_REFRESH_HISTORIA }}
  YT_REFRESH_VESTIBULAR: ${{ secrets.YT_REFRESH_VESTIBULAR }}
  YT_REFRESH_LIVROS: ${{ secrets.YT_REFRESH_LIVROS }}
  GH_PAT: ${{ secrets.GH_PAT }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  longos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt

      - name: Qual vídeo ganha blocos nesta rodada
        id: fila
        if: inputs.acao == '' || inputs.acao == 'rodada'
        run: python -m pipeline.longo para-escrever

      - name: Escrever e checar 3 blocos
        if: steps.fila.outputs.escrever != '' || inputs.acao == 'escrever'
        uses: ./.github/actions/agentes
        with:
          comando: /longo-escrever ${{ steps.fila.outputs.escrever || inputs.pasta }} 3
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Salvar os blocos
        if: always()
        run: .github/scripts/salvar.sh "longos - blocos"

      - name: Mídia já feita (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            canais/*/longos/*/midia/voz
            canais/*/longos/*/midia/voz.json
            canais/*/longos/*/midia/ilustracoes
          key: longos-midia-${{ github.run_id }}
          restore-keys: longos-midia-

      - name: FFmpeg
        if: inputs.acao == '' || inputs.acao == 'rodada' || inputs.acao == 'escrever'
        timeout-minutes: 10
        run: |
          if ! timeout 180 bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null"; then
            curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          fi

      - name: Modelo de transcrição (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Avançar (narração, imagens, montagem)
        if: inputs.acao == '' || inputs.acao == 'rodada' || inputs.acao == 'escrever'
        run: |
          mkdir -p canais/logs
          git pull -q --rebase || true
          python -m pipeline.longo em-andamento
          for p in $(python -m pipeline.longo em-andamento); do
            python -m pipeline.longo avancar "$p" 2>&1 | grep -v "HTTP Request" | tee -a canais/logs/longos-$(date -u +%Y%m%d-%H%M%S).log || true
          done

      - name: Guardar a mídia para a próxima rodada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            canais/*/longos/*/midia/voz
            canais/*/longos/*/midia/voz.json
            canais/*/longos/*/midia/ilustracoes
          key: longos-midia-${{ github.run_id }}

      - name: Agendar (depois do "aprovar")
        if: inputs.acao == 'agendar'
        run: python -m pipeline.longo agendar "${{ inputs.pasta }}"

      - name: Cancelar
        if: inputs.acao == 'cancelar'
        run: python -m pipeline.longo cancelar "${{ inputs.pasta }}"

      - name: Painel
        if: always()
        run: python -m pipeline.painel || true

      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "longos - ${{ inputs.acao || 'rodada' }}"
