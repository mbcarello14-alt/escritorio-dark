name: Telegram
# Cada mensagem sua no Telegram chega aqui (via Cloudflare) e vira uma execução.
on:
  repository_dispatch:
    types: [telegram]
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando, como no Telegram (ex.: /lote, /status, /pauta historia)"
        required: true
        default: /status

permissions:
  contents: write
  actions: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  atender:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar

      - name: Ler a mensagem
        id: bot
        run: python -m pipeline.bot receber

      - name: Salvar
        run: .github/scripts/salvar.sh "telegram - mensagem recebida"

      - name: Agentes trabalhando
        if: steps.bot.outputs.comando != ''
        uses: ./.github/actions/agentes
        with:
          comando: ${{ steps.bot.outputs.comando }}
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Amostras de voz
        if: steps.bot.outputs.vozes != ''
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1; pip install -q edge-tts && python -m pipeline.amostras

      - name: Entregar no Telegram
        id: entrega
        if: steps.bot.outputs.pos != ''
        env:
          POS: ${{ steps.bot.outputs.pos }}
          PASTA: ${{ steps.bot.outputs.pasta }}
          PASTAS: ${{ steps.bot.outputs.pastas }}
        run: python -m pipeline.bot "$POS" $PASTA $PASTAS

      - name: Painel
        if: always()
        run: python -m pipeline.painel || true

      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "agentes - ${{ steps.bot.outputs.comando || 'mensagem' }}"

      - name: Mandar para a produção
        if: steps.bot.outputs.produzir != '' || steps.entrega.outputs.produzir != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run producao.yml -f pasta="${{ steps.bot.outputs.produzir || steps.entrega.outputs.produzir }}"

      - name: Reels chamativos
        if: steps.bot.outputs.reel_acao != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reels.yml -f acao="${{ steps.bot.outputs.reel_acao }}" -f pasta="${{ steps.bot.outputs.reel_pasta }}"

      - name: Avisar erro
        if: failure()
        run: python -m pipeline.bot erro "${{ steps.bot.outputs.pasta }}"
