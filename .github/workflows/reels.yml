name: Reels chamativos
# Sábado, segunda e quarta às 10h (Brasília): cada canal ganha um reel 3D (3 por canal por semana);
# o vídeo pronto chega no Telegram para você aprovar.
on:
  schedule:
    - cron: "0 13 * * 6"
    - cron: "0 13 * * 1"
    - cron: "0 13 * * 3"
  workflow_dispatch:
    inputs:
      acao:
        description: "gerar | produzir | ajustar | publicar"
        default: gerar
      pasta:
        description: "Pasta do reel (para produzir, ajustar e publicar)"
        default: ""

permissions:
  contents: write

concurrency:
  group: reels-${{ inputs.pasta || 'semana' }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_HISTORIA: ${{ secrets.YT_REFRESH_HISTORIA }}
  YT_REFRESH_VESTIBULAR: ${{ secrets.YT_REFRESH_VESTIBULAR }}
  YT_REFRESH_LIVROS: ${{ secrets.YT_REFRESH_LIVROS }}
  GH_PAT: ${{ secrets.GH_PAT }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt

      - name: Planejar a semana
        id: plano
        if: inputs.acao == '' || inputs.acao == 'gerar'
        run: python -m pipeline.reel planejar

      - name: Agentes criam os reels
        if: steps.plano.outputs.pastas != ''
        uses: ./.github/actions/agentes
        with:
          comando: /reels ${{ steps.plano.outputs.pastas }}
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Agente aplica o ajuste
        if: inputs.acao == 'ajustar'
        uses: ./.github/actions/agentes
        with:
          comando: /reel-ajustar ${{ inputs.pasta }}
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: FFmpeg e navegador para a cena 3D
        if: inputs.acao != 'publicar'
        timeout-minutes: 10
        run: |
          if ! timeout 180 bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null"; then
            curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          fi
          npm i --no-save --prefix pipeline/reels playwright-core@1.48.2 >/dev/null
          ls /usr/bin/google-chrome

      - name: Modelo de transcrição (cache)
        if: inputs.acao != 'publicar'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Montar os reels
        if: inputs.acao != 'publicar'
        run: |
          mkdir -p canais/logs
          pastas="${{ steps.plano.outputs.pastas }}"
          [ -n "${{ inputs.pasta }}" ] && pastas="${{ inputs.pasta }}"
          for p in $pastas; do
            [ -f "$p/reel.json" ] || { echo "sem reel.json em $p"; continue; }
            if [ "${{ inputs.acao }}" = "ajustar" ]; then rm -f "$p/audio/bloco_01.wav"; fi
            python -m pipeline.reel produzir "$p" 2>&1 | grep -v "quadro [0-9]" | tee -a canais/logs/reels-$(date -u +%Y%m%d-%H%M%S).log || true
          done

      - name: Publicar (depois do "aprovar")
        if: inputs.acao == 'publicar'
        run: python -m pipeline.reel publicar "${{ inputs.pasta }}"

      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "reels - ${{ inputs.acao || 'semana' }}"
