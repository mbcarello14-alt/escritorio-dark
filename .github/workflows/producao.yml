name: Produção
# Renderiza o vídeo e agenda no YouTube. Disparado sozinho quando o último áudio chega.
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do vídeo (ex.: canais/historia/videos/2026-10-26)"
        required: true
      voz:
        description: "Forçar narrador (ex.: gemini = só Charon/Orus/Leda, sem reserva). Vazio = padrão do canal"
        required: false
        default: ""
      sem_upload:
        description: "Só gerar o vídeo, sem subir (teste)"
        type: boolean
        default: false

concurrency:
  group: producao-${{ inputs.pasta }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  GH_PAT: ${{ secrets.GH_PAT }}   # gera a chave do worker (ilustrações Flux)
  HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
  HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_HISTORIA: ${{ secrets.YT_REFRESH_HISTORIA }}
  YT_REFRESH_VESTIBULAR: ${{ secrets.YT_REFRESH_VESTIBULAR }}
  YT_REFRESH_LIVROS: ${{ secrets.YT_REFRESH_LIVROS }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Ilustrações e narração já feitas (cache)
        # se a montagem falhar e rodar de novo, reaproveita imagens e áudios (não gasta cota de novo)
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.pasta }}/saida/ilustracoes
            ${{ inputs.pasta }}/audio/*.wav
          key: material-${{ inputs.pasta }}-${{ github.run_id }}
          restore-keys: material-${{ inputs.pasta }}-

      - name: Modelo de transcrição (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Montar o vídeo
        run: |
          mkdir -p canais/logs
          LOG=canais/logs/motor-$(date -u +%Y%m%d-%H%M%S).log
          extra=""; [ "${{ inputs.sem_upload }}" = "true" ] && extra="--sem-upload"
          set -o pipefail
          [ -n "${{ inputs.voz }}" ] && export MOTOR_VOZ="${{ inputs.voz }}"
          python -m pipeline.produzir "${{ inputs.pasta }}" $extra 2>&1 | grep -v -i "key=" | tee "$LOG"

      - name: Guardar o vídeo (7 dias, para baixar se quiser)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            ${{ inputs.pasta }}/saida/video.mp4
            ${{ inputs.pasta }}/saida/thumbnail.jpg
            ${{ inputs.pasta }}/saida/legendas.srt
            ${{ inputs.pasta }}/saida/tmp/cortes/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Avisar no Telegram
        if: inputs.sem_upload == false
        run: python -m pipeline.bot produzido "${{ inputs.pasta }}"

      - name: Painel
        if: always()
        run: python -m pipeline.painel || true

      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "produção - ${{ inputs.pasta }}"

      - name: Avisar erro
        if: failure()
        run: python -m pipeline.bot erro "${{ inputs.pasta }}"
