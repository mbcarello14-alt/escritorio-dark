name: Rodar etapa
# Reexecuta uma etapa dos agentes manualmente (ex.: quando algo falhou).
on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Ex.: /roteiro canais/historia/videos/2026-10-23"
        required: true
      pos:
        description: "Depois: enviar-pautas | enviar-roteiro | enviar-blocos | (vazio)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  etapa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Agentes trabalhando
        uses: ./.github/actions/agentes
        with:
          comando: ${{ inputs.comando }}
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Entregar no Telegram
        id: entrega
        if: inputs.pos != ''
        env:
          POS: ${{ inputs.pos }}
          CMD: ${{ inputs.comando }}
        run: python -m pipeline.bot "$POS" $(echo "$CMD" | cut -d' ' -f2-)
      - name: Painel
        if: always()
        run: python -m pipeline.painel || true
      - name: Salvar
        if: always()
        run: .github/scripts/salvar.sh "etapa manual - ${{ inputs.comando }}"
      - name: Mandar para a produção
        if: steps.entrega.outputs.produzir != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run producao.yml -f pasta="${{ steps.entrega.outputs.produzir }}"
