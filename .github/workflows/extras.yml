name: Vídeo explicativo
# Monta o vídeo "como funciona o Escritório Dark" (HyperFrames + voz do Gemini) e manda no Telegram. Não publica.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  HYPERFRAMES_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
        with:
          requisitos: pipeline/requirements-producao.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FFmpeg
        timeout-minutes: 10
        run: |
          if ! timeout 180 bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null"; then
            curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          fi
      - name: Modelo de transcrição (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Narração e composição
        run: |
          mkdir -p /tmp/proj/assets
          cp extras/explicativo/hyperframes.json extras/explicativo/meta.json /tmp/proj/
          cd /tmp/proj && npm init -y >/dev/null && npm i --no-save hyperframes@0.9.40 gsap@3.13.0 >/dev/null
          cp node_modules/gsap/dist/gsap.min.js assets/
          cd "$GITHUB_WORKSPACE" && python extras/explicativo/montar.py /tmp/proj
      - name: Render
        run: |
          cd /tmp/proj
          npx hyperframes check || true
          npx hyperframes render -o /tmp/explicativo.mp4
      - name: Mandar no Telegram
        run: |
          V=/tmp/explicativo.mp4
          if [ $(stat -c %s "$V") -gt 48000000 ]; then
            ffmpeg -v error -y -i "$V" -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 26 -c:a aac -b:a 128k /tmp/explicativo-720.mp4 && V=/tmp/explicativo-720.mp4
          fi
          python -c "import sys; from pipeline import telegram as T; T.enviar_video(sys.argv[1], '🎬 <b>Como funciona o Escritório Dark</b> (vídeo de teste, não publicado)', 1920, 1080)" "$V"
      - name: Guardar o vídeo (ramo entregas)
        run: |
          git config user.name "Escritório Dark"; git config user.email "escritorio-dark@users.noreply.github.com"
          mkdir -p /tmp/ent && cd /tmp/ent && git init -q && git checkout -q -b entregas
          ffmpeg -v error -y -i /tmp/explicativo.mp4 -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 160k explicativo.mp4
          git add explicativo.mp4 && git -c user.name="Escritório Dark" -c user.email="escritorio-dark@users.noreply.github.com" commit -qm "vídeo explicativo"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" entregas
