name: Agentes (Claude Code)
description: Roda um comando do escritório no Claude Code em modo automático
inputs:
  comando:
    description: ex. /roteiro canais/historia/videos/2026-10-26
    required: true
  token:
    description: CLAUDE_CODE_OAUTH_TOKEN
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.token }}
        COMANDO: ${{ inputs.comando }}
      run: |
        npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
        echo "▶ claude -p \"$COMANDO\""
        mkdir -p canais/logs
        LOG="canais/logs/$(date -u +%Y%m%d-%H%M%S)-$(echo "$COMANDO" | cut -d' ' -f1 | tr -dc 'a-z').log"
        echo "comando: $COMANDO" > "$LOG"
        set +e
        claude -p "$COMANDO" \
          --permission-mode acceptEdits \
          --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,WebSearch,WebFetch,Task,Agent,TodoWrite,Bash(python -m pipeline.validar:*),Bash(python3 -m pipeline.validar:*)" \
          --verbose --output-format stream-json > "$LOG.jsonl" 2>> "$LOG"
        codigo=$?
        set -e
        python3 .github/scripts/resumir_log.py "$LOG.jsonl" >> "$LOG" || true
        echo "codigo de saida: $codigo" >> "$LOG"
        tail -c 60000 "$LOG" >> "$GITHUB_STEP_SUMMARY"
        rm -f "$LOG.jsonl"
        exit $codigo
